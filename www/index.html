<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>SANJU</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <div class="app">

    <!-- Top bar -->
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="brand">SANJU</div>
      <div class="topbar-right">
        <button class="icon-btn" id="bellBtn" aria-label="Notifications">
          <svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="dot"></span>
        </button>
        <div class="avatar">S</div>
      </div>
    </header>

    <main class="content">

      <!-- Greeting -->
      <section class="greeting">
        <p class="hello" id="greetingText">শুভ সন্ধ্যা,</p>
        <h1 class="username" id="userName">বস</h1>
        <p class="status" id="statusLine">প্রস্তুত আছি</p>
      </section>

      <div class="energy-pill" id="energyPill">
        <svg viewBox="0 0 24 24" class="bolt"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8z"/></svg>
        <span id="energyLabel">অনলাইন</span>
      </div>

      <!-- Orb -->
      <section class="orb-wrap">
        <div class="orb" id="orb">
          <svg class="orb-ring" viewBox="0 0 220 220">
            <circle class="ring-track" cx="110" cy="110" r="96"/>
            <circle class="ring-arc arc-cyan" cx="110" cy="110" r="96"/>
            <circle class="ring-arc arc-magenta" cx="110" cy="110" r="96"/>
          </svg>
          <div class="orb-core">
            <span class="eyebrow">AI ASSISTANT</span>
            <span class="wordmark">S.A.N.J.U</span>
            <div class="waveform" id="waveform">
              <span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span>
            </div>
            <span class="orb-state" id="orbState">শুনছি...</span>
          </div>
        </div>
      </section>

      <!-- Quick actions -->
      <section class="quick-row">
        <button class="quick-btn" data-action="phone">
          <svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
          ফোন কন্ট্রোল
        </button>
        <button class="quick-btn" data-action="notes">
          <svg viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
          নোট
        </button>
        <button class="quick-btn" data-action="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          সেটিংস
        </button>
      </section>

      <!-- Status cards -->
      <section class="card-row">
        <div class="stat-card">
          <div class="stat-head"><svg viewBox="0 0 24 24"><rect x="1" y="6" width="18" height="12" rx="2"/><line x1="23" y1="13" x2="23" y2="11"/></svg>ব্যাটারি</div>
          <div class="stat-value" id="batteryValue">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-head"><svg viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>নেটওয়ার্ক</div>
          <div class="stat-value" id="networkValue">—</div>
        </div>
        <div class="stat-card">
          <div class="stat-head"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>মুড</div>
          <div class="stat-value" id="moodValue">ভালো</div>
        </div>
      </section>

      <!-- Chat log -->
      <section class="chat-log" id="chatLog" aria-live="polite"></section>

    </main>

    <!-- Input bar -->
    <div class="input-bar">
      <button class="icon-btn small" id="attachBtn" aria-label="Attach">
        <svg viewBox="0 0 24 24"><path d="M21.44 11.05 12.25 20.24a5.5 5.5 0 0 1-7.78-7.78l9.19-9.19a3.5 3.5 0 0 1 4.95 4.95L9.41 17.42a1.5 1.5 0 0 1-2.12-2.12l8.49-8.49"/></svg>
      </button>
      <input type="text" id="chatInput" placeholder="সাঞ্জুকে কিছু জিজ্ঞেস করুন..." autocomplete="off" />
      <button class="icon-btn small send" id="sendBtn" aria-label="Send">
        <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-item active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9"/><path d="M9 21V12h6v9"/><path d="M5 10v11h14V10"/></svg>
        <span>হোম</span>
      </button>
      <button class="nav-item" data-tab="scan">
        <svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
        <span>স্ক্যান</span>
      </button>
      <button class="mic-btn" id="micBtn" aria-label="Voice">
        <svg viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </button>
      <button class="nav-item" data-tab="memories">
        <svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        <span>স্মৃতি</span>
      </button>
      <button class="nav-item" data-tab="chat">
        <svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>চ্যাট</span>
      </button>
    </nav>

  </div>

  <!-- Settings modal -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal">
      <h2>সেটিংস</h2>
      <label for="apiKeyInput">Groq API Key</label>
      <input type="password" id="apiKeyInput" placeholder="gsk_..." />
      <label for="nameInput">আপনার নাম</label>
      <input type="text" id="nameInput" placeholder="বস" />
      <label for="modelInput">Groq মডেল</label>
      <input type="text" id="modelInput" placeholder="openai/gpt-oss-120b" />
      <label for="voiceLangSelect">কথা বলার ভাষা (TTS)</label>
      <select id="voiceLangSelect">
        <option value="auto">স্বয়ংক্রিয় (যা বলা হচ্ছে সেই ভাষায়)</option>
        <option value="bn-BD">বাংলা</option>
        <option value="hi-IN">হিন্দি</option>
        <option value="en-IN">ইংরেজি</option>
      </select>
      <div class="modal-actions">
        <button class="btn ghost" id="closeSettings">বাতিল</button>
        <button class="btn primary" id="saveSettings">সেভ করুন</button>
      </div>
    </div>
  </div>

  <!-- Notes modal -->
  <div class="modal-overlay" id="notesModal">
    <div class="modal">
      <h2>নোট</h2>
      <div class="list-box" id="notesList"></div>
      <div class="add-row">
        <input type="text" id="noteInput" placeholder="নতুন নোট লিখো..." />
        <button class="btn primary small-btn" id="addNoteBtn">যোগ করো</button>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="closeNotes">বন্ধ করো</button>
      </div>
    </div>
  </div>

  <!-- Memories modal -->
  <div class="modal-overlay" id="memoriesModal">
    <div class="modal">
      <h2>স্মৃতি</h2>
      <p class="hint-text">এখানে যা লিখবে, সাঞ্জু সবসময় মনে রাখবে (যেমন তোমার পছন্দ, জন্মদিন, অভ্যাস)।</p>
      <div class="list-box" id="memoriesList"></div>
      <div class="add-row">
        <input type="text" id="memoryInput" placeholder="যেমন: আমার জন্মদিন ১২ মার্চ" />
        <button class="btn primary small-btn" id="addMemoryBtn">যোগ করো</button>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="closeMemories">বন্ধ করো</button>
      </div>
    </div>
  </div>

  <!-- Scan HUD overlay -->
  <div class="hud-overlay" id="scanModal">
    <div class="hud">
      <div class="hud-radar">
        <div class="hud-radar-sweep"></div>
        <div class="hud-radar-ring"></div>
        <div class="hud-radar-ring r2"></div>
        <div class="hud-center">SYSTEM<br/>SCAN</div>
      </div>
      <div class="hud-log" id="hudLog"></div>
      <button class="btn ghost" id="closeScan">বন্ধ করো</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
